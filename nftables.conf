#!/usr/bin/nft -f
# SPDX-License-Identifier: AGPL-3.0-or-later
# vim:set ts=2 sw=2 et:

# Dedicated strict input filter for Vulnbox-AutoConfig. This table does not
# replace unrelated nftables tables. The input policy intentionally drops
# inbound traffic except established connections and the SSH allowlist below.

destroy table inet vulnbox_autoconfig
table inet vulnbox_autoconfig {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"

    # =========================================================================
    # REGOLE DI ACCESSO SSH (Tutte attive contemporaneamente)
    # =========================================================================

    # Accesso tramite le interfacce fisiche delle VPN
    iifname "wt0" tcp dport 22222 accept comment "allow sshd via netbird interface"
    iifname "tailscale0" tcp dport 22222 accept comment "allow sshd via tailscale interface"

    # Accesso tramite la subnet globale CGNAT (valida sia per NetBird che per Tailscale)
    ip saddr 100.64.0.0/10 tcp dport 22222 accept comment "allow sshd via vpn subnet (netbird/tailscale)"
    
    # =========================================================================

    counter drop comment "drop all other inbound traffic"
  }
}
