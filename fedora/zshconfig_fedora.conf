#config for fedora
export PATH="/app/extra/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
# Some minimal distros (e.g. antiX) don't put the sbin dirs on a normal user's
# PATH, so admin tools (ip, ss, ifconfig, iptables, fdisk, …) appear "missing".
# Prepend them if absent — idempotent, so re-sourcing ~/.zshrc won't duplicate.
for _sbin in /usr/local/sbin /usr/sbin /sbin; do
    case ":$PATH:" in *":$_sbin:"*) ;; *) [ -d "$_sbin" ] && PATH="$_sbin:$PATH" ;; esac
done
unset _sbin
export PATH
export DEBUGINFOD_URLS="https://debuginfod.fedoraproject.org"
export EDITOR="nano"
export VISUAL="nano"
export CLICOLOR=1
export LS_COLORS='di=0;36:fi=0;37:'

# --- 2. STARTUP (Fastfetch) ---
[[ $- == *i* ]] && if command -v fastfetch &>/dev/null; then
    fastfetch --color blue --logo-color-1 blue --logo-color-2 blue
    printf '\e[0m'
fi

export ZSH="$HOME/.oh-my-zsh"
ZSH_THEME=""
zstyle ':omz:update' mode auto
COMPLETION_WAITING_DOTS="true"
ENABLE_CORRECTION="true"
plugins=(git)
source $ZSH/oh-my-zsh.sh

PROMPT='%F{214}%n@%m%f %F{34}%~$%f %F{white}%D{%H:%M:%S}%f '

HISTSIZE=10000
SAVEHIST=20000
setopt HIST_IGNORE_DUPS HIST_IGNORE_SPACE autocd correct
unsetopt PROMPT_SP

# --- ALIASES ---
alias fastfetch="fastfetch --color blue --logo-color-1 blue --logo-color-2 blue"
alias zshrc="nano ~/.zshrc"
alias zsh="source ~/.zshrc"
alias lss="lsd -lah --group-directories-first --icon always --color always"
alias ..="cd .."
alias ...="cd ../.."
alias sshconf="nano ~/.ssh/config"
alias nvimrc="sudo nano ~/.config/nvim/init.lua"
alias nvimconf="sudo nvim ~/.config/nvim/init.lua"
alias zshconf="nvim ~/.zshrc"
alias pipinst='pip install --break-system-packages'
alias gitconfig="nano ~/.gitconfig"
alias explain=tldr
alias installaapp="sudo dnf install"
alias aggiornaeinstalla="sudo dnf upgrade"

# --- IDA Pro Bottle Launcher ---
alias ida='flatpak run --command=bottles-cli com.usebottles.bottles run -b "IDA" -p "ida"'
alias cdida='cd ~/.var/app/com.usebottles.bottles/data/bottles/bottles/IDA/drive_c/Program\ Files/IDA\ Professional\ 9.0/'

# Tools & Fun
alias cock='tty-clock -c -C 4 -r -f "%A, %B %d, %Y"'
alias matrix="cmatrix -C blue"
alias rick='echo -ne "\e[34m"; curl -s ascii.live/rick; echo -ne "\e[0m"'
alias forrest='echo -ne "\e[34m"; curl -s ascii.live/forrest; echo -ne "\e[0m"'
alias knot='echo -ne "\e[34m"; curl -s ascii.live/knot; echo -ne "\e[0m"'
alias parrot='echo -ne "\e[34m"; curl -s ascii.live/parrot; echo -ne "\e[0m"'

# AD-CTF Power Tools
alias myip="ip -br addr"
alias listening="ss -tulpn | grep LISTEN"
alias sniff="sudo tcpdump -i any -A 'tcp port 80'"

# WireGuard
alias tunnel="sudo wg-quick up"
alias untunnel="sudo wg-quick down"

# OpenVPN
alias vpnopen='sudo openvpn --daemon --config'
alias vpnclose="sudo killall openvpn"

# Docker
alias dps="docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
alias dlog="docker compose logs -f"
alias dbuild="docker compose up -d --build"
alias ddown="docker compose down"

# --- FUNCTIONS ---
clear_msg() {
    clear
    echo "Terminal cleared. Ready to go."
}

# --- Konsole shortcut sync (auto-updating) ---
# Keep Konsole's [Shortcuts] in ~/.config/konsolerc in sync with a plain-text file
# you maintain, so editing that list updates Konsole on the next shell — the live
# version of the shipped static konsolerc. Each non-comment line is "Action=Key",
# e.g.  New Tab=Ctrl+Shift+T  ([Shortcuts] header / blank / # lines are ignored).
# The source file is auto-discovered (override with KONSOLE_SHORTCUTS=/path); it
# only re-syncs when that file actually changed, and is a silent no-op when there's
# no konsolerc (e.g. a headless vulnbox) or no shortcuts file.
_konsole_sync_shortcuts() {
    local konsolerc="${KONSOLE_CONFIG:-$HOME/.config/konsolerc}"
    [ -f "$konsolerc" ] || return 0
    local src="${KONSOLE_SHORTCUTS:-}"
    if [ -z "$src" ]; then
        local c
        for c in "${XDG_DOCUMENTS_DIR:-}/konsole/shortcuts.txt" \
                 "$HOME/Documents/konsole/shortcuts.txt" \
                 "$HOME/Documenti/konsole/shortcuts.txt" \
                 "$HOME/.config/konsole/shortcuts.txt"; do
            [ -n "$c" ] && [ -f "$c" ] && { src="$c"; break; }
        done
    fi
    [ -n "$src" ] && [ -f "$src" ] || return 0
    [ "$src" -nt "$konsolerc" ] || return 0   # only when the source changed
    command -v awk >/dev/null 2>&1 || return 0

    local tmp; tmp="$(mktemp 2>/dev/null)" || return 0
    awk -v src="$src" '
        BEGIN { body=""
            while ((getline l < src) > 0) {
                if (l ~ /^[[:space:]]*#/ || l ~ /^[[:space:]]*$/ || l ~ /^[[:space:]]*\[/) continue
                body = body l "\n"
            } }
        /^[[:space:]]*\[Shortcuts\][[:space:]]*$/ { print; printf "%s", body; seen=1; insec=1; next }
        insec && /^[[:space:]]*\[/ { insec=0 }
        insec { next }
        { print }
        END { if (!seen) { print "[Shortcuts]"; printf "%s", body } }
    ' "$konsolerc" > "$tmp" && cat "$tmp" > "$konsolerc"
    rm -f "$tmp"

    # Tell KGlobalAccel to reload now (no-op without a running session bus).
    command -v dbus-send >/dev/null 2>&1 && \
        dbus-send --type=method_call --dest=org.kde.KGlobalAccel \
            /component/org_kde_konsole_desktop \
            org.kde.kglobalaccel.Component.reconfigure >/dev/null 2>&1
    return 0
}
[[ $- == *i* ]] && _konsole_sync_shortcuts

# --- Robust Plugin Loading ---

# 1. Syntax Highlighting
for plugin in /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh \
              /usr/share/zsh/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh; do
    if [ -f "$plugin" ]; then
        source "$plugin"
        break
    fi
done

# 2. Autosuggestions
for plugin in /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh \
              /usr/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh; do
    if [ -f "$plugin" ]; then
        source "$plugin"
        break
    fi
done
