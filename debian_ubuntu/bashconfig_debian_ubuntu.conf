alias fail2ban="sudo fail2ban-client status sshd"
alias nftables="sudo nft -f /etc/nftables.conf"
alias nftablesrc="sudo nano /etc/nftables.conf"
sshrc() {
  local sshd_config="/etc/ssh/sshd_config.d/99-custom-ssh.conf"
  if [[ ! -f "$sshd_config" && -f /etc/ssh/sshd_config.d/00-custom-ssh.conf ]]; then
    sshd_config="/etc/ssh/sshd_config.d/00-custom-ssh.conf"
  fi
  sudo nano "$sshd_config"
}
