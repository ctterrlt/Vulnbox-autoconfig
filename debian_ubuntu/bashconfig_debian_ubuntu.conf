# Bash aliases derived from the matching distro zsh configuration.
# Loaded by install_bash_config.sh without replacing the user's .bashrc.

_android_sdk_tools="$HOME/Android/sdk/platform-tools"
if [[ -d "$_android_sdk_tools" && ":$PATH:" != *":$_android_sdk_tools:"* ]]; then
  PATH="${PATH:+$PATH:}$_android_sdk_tools"
fi
unset _android_sdk_tools
export PATH

alias fastfetch="fastfetch --color blue --logo-color-1 blue --logo-color-2 blue"
alias zshrc="nano ~/.zshrc"
alias bashrc="nano ~/.bashrc"
alias bashreload="source ~/.bashrc"
alias lss="lsd -lah --group-directories-first --icon always --color always"
alias ..="cd .."
alias ...="cd ../.."
alias pythonn="uv run python"
alias sshconf="nano ~/.ssh/config"
alias nvimrc="nano ~/.config/nvim/init.lua"
alias nvimconf="nvim ~/.config/nvim/init.lua"
alias zshconf="nvim ~/.zshrc"
alias pipinst='pip install --user --break-system-packages'
uvinst() {
  local python_bin
  python_bin=$(type -P python3) || return
  uv pip install --python "$python_bin" --prefix "$HOME/.local" "$@"
}

uvupdate() {
  local python_bin
  python_bin=$(type -P python3) || return
  uv pip install --python "$python_bin" --prefix "$HOME/.local" --upgrade "$@"
}

uvtotal() {
  local python_bin
  python_bin=$(type -P python3) || return
  printf 'Checking for outdated user packages with %s...\n' "$python_bin"
  local outdated package_names
  outdated=$("$python_bin" -m pip list --user --outdated --format=json) || return
  package_names=$(printf '%s\n' "$outdated" | "$python_bin" -c 'import json, sys; print("\n".join(item["name"] for item in json.load(sys.stdin)))') || return
  local -a packages
  mapfile -t packages <<< "$package_names"
  if (( ${#packages[@]} == 0 )) || [[ -z "${packages[0]}" ]]; then
    printf '%s\n' "No outdated user packages."
    return 0
  fi
  printf 'Updating %s user packages with %s in one uv invocation...\n' "${#packages[@]}" "$python_bin"
  uv pip install --python "$python_bin" --prefix "$HOME/.local" --upgrade "${packages[@]}"
}

alias gitconfig="nano ~/.gitconfig"
alias explain=tldr
alias installaapp="sudo apt install"
alias aggiornaeinstalla="sudo apt update && sudo apt upgrade"
alias ida='flatpak run --command=bottles-cli com.usebottles.bottles run -b "IDA" -p "ida"'
alias cdida='cd ~/.var/app/com.usebottles.bottles/data/bottles/bottles/IDA/drive_c/Program\ Files/IDA\ Professional\ 9.0/'
