alias pipinst='pip install --user --break-system-packages'
uvinst() {
  local python_bin
  python_bin=$(whence -p python3) || return
  uv pip install --python "$python_bin" --prefix "$HOME/.local" "$@"
}

uvupdate() {
  local python_bin
  python_bin=$(whence -p python3) || return
  uv pip install --python "$python_bin" --prefix "$HOME/.local" --upgrade "$@"
}

uvtotal() {
  local python_bin
  python_bin=$(whence -p python3) || return
  print -r -- "Checking for outdated user packages with $python_bin..."
  local outdated package_names
  outdated=$("$python_bin" -m pip list --user --outdated --format=json) || return
  package_names=$(print -r -- "$outdated" | "$python_bin" -c 'import json, sys; print("\n".join(item["name"] for item in json.load(sys.stdin)))') || return
  local -a packages
  packages=("${(@f)package_names}")
  if (( ${#packages} == 0 )) || [[ -z "$packages[1]" ]]; then
    print -r -- "No outdated user packages."
    return 0
  fi
  print -r -- "Updating ${#packages} user packages with $python_bin in one uv invocation..."
  uv pip install --python "$python_bin" --prefix "$HOME/.local" --upgrade "${packages[@]}"
}

