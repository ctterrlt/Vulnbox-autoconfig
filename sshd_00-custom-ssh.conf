# Imposta la porta personalizzata (sostituisci 22222 con quella che preferisci)
Port 22222

# Disabilita il login come root
PermitRootLogin no

# Disabilita l'autenticazione tramite password (usa solo chiavi SSH)
# ATTENZIONE: Assicurati di aver già copiato la tua chiave pubblica sul server!
PasswordAuthentication no

# Misure di sicurezza extra
PermitEmptyPasswords no
MaxAuthTries 3
